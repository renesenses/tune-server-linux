[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tune-server"
version = "0.8.99"
description = "Network-accessible music server with multi-room playback"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "aiosqlite>=0.20",
    "mutagen>=1.47",
    "musicbrainzngs>=0.7",
    "python3-discogs-client>=2.7",
    "async-upnp-client>=0.38",
    "pyatv>=0.14",
    "pychromecast>=14.0",
    "zeroconf>=0.131",
    "sounddevice>=0.4",
    # Pin to <2.0 so the wheel comes from manylinux_2_17 (gcc 7 baseline,
    # GLIBCXX_3.4.22). numpy 2.1+ moved to manylinux_2_28 which requires
    # GLIBCXX_3.4.32 — incompatible with the libstdc++ bundled by
    # PyInstaller from the ubuntu-22.04 release runner. Reported by Eric
    # on 2026-04-29 (Linux tar.gz crashed at startup).
    "numpy>=1.26,<2.0",
    "tidalapi>=0.7",
    "yt-dlp>=2024.1",
    "ytmusicapi>=1.8",
    "aiohttp>=3.9",
    "aiohttp_socks>=0.10",
    "watchfiles>=0.21",
    "pydantic-settings>=2.1",
    "Pillow>=10.2,<11",  # Pillow 11+ ships manylinux_2_28 wheels (GLIBCXX_3.4.32)
    "structlog>=24.1",
    "python-multipart>=0.0.6",
    "spotipy>=2.24.0",
    "deezer-python>=7.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "cryptography>=41.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
tune-server = "tune_server.__main__:main"
tune-migrate-db = "tune_server.db.migrate:main"
