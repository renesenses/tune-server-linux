[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tune-server"
version = "0.1.3"
description = "Network-accessible music server with multi-room playback"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "aiosqlite>=0.20",
    "mutagen>=1.47",
    "musicbrainzngs>=0.7",
    "python3-discogs-client>=2.7",
    "async-upnp-client>=0.38",
    "pyatv>=0.14",
    "zeroconf>=0.131",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "tidalapi>=0.7",
    "ytmusicapi>=1.4",
    "yt-dlp>=2024.1",
    "aiohttp>=3.9",
    "watchfiles>=0.21",
    "pydantic-settings>=2.1",
    "Pillow>=10.2",
    "structlog>=24.1",
    "python-multipart>=0.0.6",
    "spotipy>=2.24.0",
    "deezer-python>=7.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
tune-server = "tune_server.__main__:main"
