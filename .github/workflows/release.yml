name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and PyInstaller
        run: |
          pip install pyinstaller
          pip install .

      - name: Build binary with PyInstaller (Unix)
        if: matrix.platform != 'windows'
        run: |
          pyinstaller --name tune-server --onedir \
            --add-data "web:web" \
            --collect-all tune_server \
            --noconfirm \
            tune_server/__main__.py

      - name: Build binary with PyInstaller (Windows)
        if: matrix.platform == 'windows'
        run: |
          pyinstaller --name tune-server --onedir --add-data "web;web" --collect-all tune_server --noconfirm tune_server/__main__.py

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dist && tar czf "../tune-server-${VERSION}-linux.tar.gz" tune-server/
          cd .. && sha256sum "tune-server-${VERSION}-linux.tar.gz" | awk '{print $1}' > "tune-server-${VERSION}-linux.tar.gz.sha256"

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dist && tar czf "../tune-server-${VERSION}-macos.tar.gz" tune-server/
          cd .. && shasum -a 256 "tune-server-${VERSION}-macos.tar.gz" | awk '{print $1}' > "tune-server-${VERSION}-macos.tar.gz.sha256"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "dist/tune-server" -DestinationPath "tune-server-${VERSION}-windows.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "tune-server-${VERSION}-windows.zip").Hash.ToLower()
          Set-Content -Path "tune-server-${VERSION}-windows.zip.sha256" -Value $hash -NoNewline

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tune-server-${{ matrix.platform }}
          path: |
            tune-server-*.tar.gz
            tune-server-*.tar.gz.sha256
            tune-server-*.zip
            tune-server-*.zip.sha256
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
          NOTES=$(sed -n "/^## v${VERSION}/,/^---/{/^---/d;p}" CHANGELOG.md | tail -n +2)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            artifacts/tune-server-*.tar.gz
            artifacts/tune-server-*.tar.gz.sha256
            artifacts/tune-server-*.zip
            artifacts/tune-server-*.zip.sha256
