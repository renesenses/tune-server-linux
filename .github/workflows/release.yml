name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create archive (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="tune-server-${VERSION}-linux.tar.gz"

          tar czf "${ARCHIVE}" \
            --transform "s,^,tune-server/," \
            tune_server/ web/ pyproject.toml install.sh tune-server.service README.md CHANGELOG.md

          sha256sum "${ARCHIVE}" | awk '{print $1}' > "${ARCHIVE}.sha256"

      - name: Create archive (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="tune-server-${VERSION}-macos.tar.gz"

          mkdir -p tune-server
          cp -r tune_server web pyproject.toml install.sh tune-server.service README.md CHANGELOG.md tune-server/
          tar czf "${ARCHIVE}" tune-server

          shasum -a 256 "${ARCHIVE}" | awk '{print $1}' > "${ARCHIVE}.sha256"

      - name: Create archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $ARCHIVE = "tune-server-${VERSION}-windows.zip"

          # Create staging directory
          New-Item -ItemType Directory -Path "tune-server" -Force
          Copy-Item -Recurse "tune_server" "tune-server/tune_server"
          Copy-Item -Recurse "web" "tune-server/web"
          Copy-Item "pyproject.toml" "tune-server/"
          Copy-Item "README.md" "tune-server/"
          Copy-Item "CHANGELOG.md" "tune-server/"

          Compress-Archive -Path "tune-server" -DestinationPath "${ARCHIVE}"
          $hash = (Get-FileHash -Algorithm SHA256 "${ARCHIVE}").Hash.ToLower()
          Set-Content -Path "${ARCHIVE}.sha256" -Value $hash -NoNewline

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tune-server-${{ matrix.platform }}
          path: |
            tune-server-*.${{ matrix.platform == 'windows' && 'zip' || 'tar.gz' }}
            tune-server-*.${{ matrix.platform == 'windows' && 'zip' || 'tar.gz' }}.sha256
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # Extract section between this version header and the next --- or ## heading
          NOTES=$(sed -n "/^## v${VERSION}/,/^---/{/^---/d;p}" CHANGELOG.md | tail -n +2)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            artifacts/tune-server-*.tar.gz
            artifacts/tune-server-*.tar.gz.sha256
            artifacts/tune-server-*.zip
            artifacts/tune-server-*.zip.sha256
