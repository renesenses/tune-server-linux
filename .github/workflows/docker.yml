name: Docker Hub

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild web client from tune-web-client (always fresh)
        env:
          WEB_CLIENT_DEPLOY_KEY: ${{ secrets.WEB_CLIENT_DEPLOY_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf _web_src

          # Set up SSH deploy key for private repo access
          CLONED=false
          if [ -n "${WEB_CLIENT_DEPLOY_KEY}" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "${WEB_CLIENT_DEPLOY_KEY}" > ~/.ssh/tune_web_key && chmod 600 ~/.ssh/tune_web_key
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/tune_web_key -o StrictHostKeyChecking=no"
            if git clone --depth 1 git@github.com:renesenses/tune-web-client.git _web_src 2>/dev/null; then
              CLONED=true
            fi
            rm -f ~/.ssh/tune_web_key
          fi

          if [ "$CLONED" != "true" ]; then
            if ! git clone --depth 1 https://github.com/renesenses/tune-web-client.git _web_src 2>/dev/null; then
              echo "::warning::Could not clone tune-web-client — using whatever is in web/"
              exit 0
            fi
          fi

          # Pin the matching tag if it exists; fall back to main otherwise.
          if (cd _web_src && git fetch --depth 1 origin "v${VERSION}" 2>/dev/null); then
            (cd _web_src && git checkout FETCH_HEAD)
          else
            echo "::warning::tune-web-client v${VERSION} tag missing — using main"
          fi
          (cd _web_src && npm ci && npm run build)
          rm -rf web
          mkdir web
          cp -R _web_src/dist/. web/
          rm -rf _web_src
          echo "Web bundle:"
          ls -la web/assets | head -8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: renesenses/tune
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
